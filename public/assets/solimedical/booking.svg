  <text x="313" y="304" text-anchor="middle" font-family="monospace" font-size="54" font-weight="900" fill="#00D4FF">A-104</text>
  <text x="313" y="338" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34D399">عيادة الباطنة والقلب — غرفة رقم (1)</text>

  <rect x="64" y="380" width="498" height="270" rx="14" fill="#091522" stroke="#1E3A5F"/>
  <text x="538" y="418" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">قائمة الانتظار التالية:</text>
  <text x="538" y="462" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" fill="#CBD5E1">• تذكرة A-105 — سارة محمود (حجز واتساب مؤكد)</text>
  <text x="538" y="502" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" fill="#CBD5E1">• تذكرة A-106 — أحمد كمال (حجز بوت تليجرام)</text>
  <text x="538" y="542" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" fill="#CBD5E1">• تذكرة A-107 — منى إبراهيم (استقبال مباشر)</text>
  <text x="538" y="582" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" fill="#34D399">✓ إرسال تنبيه تلقائي للمريض قبل دوره بـ 15 دقيقة</text>
