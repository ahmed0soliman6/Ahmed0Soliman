  <rect x="36" y="124" width="554" height="556" rx="16" fill="#0D1E30" stroke="#1E3A5F"/>
  <text x="562" y="166" text-anchor="end" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">شاشة نداء الأدوار والاستقبال اللحظية</text>
  <rect x="64" y="196" width="498" height="160" rx="16" fill="#071320" stroke="#00D4FF" stroke-width="2"/>
