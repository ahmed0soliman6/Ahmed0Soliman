  <line x1="634" y1="184" x2="1140" y2="184" stroke="#1E3A5F" stroke-width="1.5"/>

  <rect x="634" y="206" width="506" height="82" rx="12" fill="#091522" stroke="#00D4FF" stroke-opacity="0.45"/>
  <text x="1116" y="240" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">05:00 م — د. أحمد المنشاوي (استشاري الباطنة والقلب)</text>
  <text x="1116" y="268" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#34D399">14 حجز مؤكد · 3 في صالة الانتظار · متاح حجز فوري</text>

  <rect x="634" y="304" width="506" height="82" rx="12" fill="#091522" stroke="#1E3A5F"/>
