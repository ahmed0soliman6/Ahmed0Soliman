  <text x="1116" y="366" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#38BDF8">11 حجز مؤكد · مزامنة تلقائية مع بوت تليجرام وواتساب</text>

  <rect x="634" y="402" width="506" height="82" rx="12" fill="#091522" stroke="#1E3A5F"/>
  <text x="1116" y="436" text-anchor="end" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">08:00 م — د. كريم عبد العزيز (جراحة العظام والمفاصل)</text>
  <text x="1116" y="464" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#FBBF24">9 حجوزات مؤكدة · إشعارات تذكير للمرضى مفعلة</text>

