<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D14"/>
      <stop offset="100%" stop-color="#0B1928"/>
    </linearGradient>
    <linearGradient id="cyan2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg2)"/>
  <rect x="16" y="16" width="1168" height="688" rx="18" fill="none" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Header -->
  <rect x="36" y="36" width="1128" height="64" rx="14" fill="#0B1826" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="1136" y="75" text-anchor="end" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">Soli Medical · إدارة المواعيد والحجز الذكي والطابور</text>
  <rect x="56" y="50" width="190" height="36" rx="10" fill="url(#cyan2)"/>
  <text x="151" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#041019">+ تسجيل حجز مريض جديد</text>

  <!-- Calendar & Time Slots -->
  <rect x="610" y="124" width="554" height="556" rx="16" fill="#0D1E30" stroke="#1E3A5F"/>
