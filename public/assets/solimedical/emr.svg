  <text x="674" y="388" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#CBD5E1">قرص واحد صباحاً قبل الإفطار يومياً لمدة 30 يوماً</text>

  <rect x="60" y="432" width="636" height="100" rx="12" fill="#091522" stroke="#1E3A5F"/>
  <text x="86" y="472" text-anchor="start" font-family="monospace" font-size="18" font-weight="800" fill="#38BDF8">Rx 2. Ezapril 10mg Tab</text>
  <text x="674" y="504" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#CBD5E1">قرص واحد مساءً يومياً مع متابعة قياس الضغط أسبوعياً</text>

  <rect x="60" y="552" width="636" height="96" rx="12" fill="#071320" stroke="#34D399" stroke-opacity="0.4"/>
  <text x="674" y="592" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34D399">موعد الاستشارة القادمة: بعد أسبوعين (تذكير تلقائي عبر واتساب)</text>
  <text x="674" y="624" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">تم حفظ الزيارة وإصدار فاتورة الاستقبال تلقائياً</text>
