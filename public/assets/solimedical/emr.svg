  <text x="1120" y="366" text-anchor="end" font-family="monospace" font-size="24" font-weight="800" fill="#34D399">76 bpm · 98%</text>

  <rect x="764" y="406" width="376" height="248" rx="12" fill="#091522" stroke="#1E3A5F"/>
  <text x="1116" y="440" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">التاريخ المرضي والزيارات السابقة:</text>
  <text x="1116" y="478" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#CBD5E1">• 12 أكتوبر: متابعة ضغط الدم وضبط الجرعة</text>
  <text x="1116" y="514" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#CBD5E1">• 04 سبتمبر: فحص إيكو ورسم قلب بالمجهود</text>
