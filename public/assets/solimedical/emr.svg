  <text x="1116" y="256" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">الرقم الطبي: #SM-20489 · فصيلة الدم: O+ · حساسية: بنسلين</text>

  <rect x="764" y="302" width="180" height="84" rx="12" fill="#091522" stroke="#00D4FF" stroke-opacity="0.35"/>
  <text x="924" y="332" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">ضغط الدم (BP)</text>
  <text x="924" y="366" text-anchor="end" font-family="monospace" font-size="24" font-weight="800" fill="#00D4FF">125/80</text>

  <rect x="960" y="302" width="180" height="84" rx="12" fill="#091522" stroke="#34D399" stroke-opacity="0.35"/>
