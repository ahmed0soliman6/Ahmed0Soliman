  <rect x="82" y="438" width="130" height="32" rx="8" fill="#FBBF24" fill-opacity="0.2"/>
  <text x="147" y="459" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBBF24">في الانتظار (التالي)</text>

