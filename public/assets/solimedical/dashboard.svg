  <text x="1095" y="75" text-anchor="end" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">Soli Medical · لوحة التحكم التنفيذية</text>
  <rect x="56" y="50" width="150" height="36" rx="10" fill="#00D4FF" fill-opacity="0.15" stroke="#00D4FF" stroke-opacity="0.4"/>
